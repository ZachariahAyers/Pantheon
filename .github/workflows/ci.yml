name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # The add-in targets net10.0-windows (WinForms and WPF), so the whole solution builds on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pantheon.slnx

      - name: Check formatting
        run: dotnet format Pantheon.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pantheon.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Pantheon.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Upload add-in
        uses: actions/upload-artifact@v7
        with:
          name: pantheon-addin
          path: src/Pantheon.AutoCAD/bin/Release/net10.0-windows/

  demo:
    name: Build and publish browser demo
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the browser demo
        run: dotnet publish src/Pantheon.Browser/Pantheon.Browser.csproj --configuration Release --output demo-dist

      - name: Check the publish output and browser script
        run: |
          test -s demo-dist/wwwroot/index.html
          test -s demo-dist/wwwroot/app.css
          test -s demo-dist/wwwroot/app.js
          test -s demo-dist/wwwroot/runtime.js
          test -s demo-dist/wwwroot/_framework/dotnet.js
          node --check demo-dist/wwwroot/app.js
          node --test tests/browser-runtime.test.mjs

      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-pantheon
          aws-region: us-east-1

      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        name: Publish to ayers.repair/opensource/pantheon/
        run: |
          aws s3 sync demo-dist/wwwroot/ s3://ayers-repair-site-993011736775/opensource/pantheon/ \
            --delete --cache-control "public, max-age=300" --only-show-errors
          aws cloudfront create-invalidation --distribution-id E1CZIGG4O8R7UI \
            --paths "/opensource/pantheon/*" --query Invalidation.Id --output text
